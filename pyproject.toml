[project]
name = "inboxguard-ai"
version = "0.3.0"
description = "Plataforma segura e auditável para gerenciamento inteligente de e-mails."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Edson Santana" }
]
dependencies = [
    "alembic>=1.18,<2.0",
    "apscheduler>=3.11,<4.0",
    "asyncpg>=0.30,<1.0",
    "cryptography>=46,<47",
    "fastapi>=0.128,<1.0",
    "google-api-python-client>=2.180,<3.0",
    "google-auth>=2.40,<3.0",
    "google-auth-httplib2>=0.2,<1.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "httpx>=0.28,<1.0",
    "openai>=2.8,<3.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "python-telegram-bot>=22.5,<23.0",
    "sqlalchemy[asyncio]>=2.0.45,<2.1",
    "structlog>=25.5,<26.0",
    "tenacity>=9.1,<10.0",
    "uvicorn[standard]>=0.40,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2.0",
    "pre-commit>=4.3,<5.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.14,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "B008", # FastAPI utiliza Depends(...) em parâmetros por design.
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "google.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: testes que validam a integração entre componentes internos",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
